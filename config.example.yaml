# LLM Proxy Configuration
# Copy this file to config.yaml and modify as needed

server:
  port: 4000
  host: 0.0.0.0

database:
  path: ./data/llm_proxy.db
  retention_days: 90

admin:
  # Choose one of the following authentication methods:
  
  # Option 1: Basic Auth (username/password)
  username: admin
  password: change_me_to_secure_password
  
  # Option 2: API Key (set X-Admin-Key header)
  # api_key: change_me_to_secure_api_key

models:
  - name: qwen-2.5-7b
    upstream: http://localhost:3000/v1/chat/completions
    cost_per_1k_input: 0.001
    cost_per_1k_output: 0.002
    # Optional: docker container behind this model. Enables manual flipping via
    # the `aliases` feature below. Requires /var/run/docker.sock to be mounted
    # into the llm_proxy container (see docker-compose.yml).
    # container:
    #   name: sglang-7b
    #   health_url: http://sglang-7b:3000/health  # optional; derived from upstream if omitted
    #   start_timeout_seconds: 360                 # how long to wait for the backend to become healthy

  - name: qwen-2.5-32b
    upstream: http://localhost:3001/v1/chat/completions
    cost_per_1k_input: 0.002
    cost_per_1k_output: 0.004

  # Example with scale-to-zero enabled:
  # - name: qwen-2.5-7b
  #   upstream: http://sglang:3000/v1/chat/completions
  #   cost_per_1k_input: 0.001
  #   cost_per_1k_output: 0.002
  #   scale_to_zero:
  #     enabled: true
  #     container_name: sglang  # Docker container name to control
  #     idle_timeout_minutes: 30  # Stop after N minutes of inactivity
  #     start_timeout_seconds: 120  # Max time to wait for container to start
  #     health_check_path: /health  # Endpoint to check if backend is ready
  #     health_check_interval_ms: 2000  # How often to check health during startup

# Model aliases. Clients can send requests to an alias (e.g. "current") and
# have them routed to the current target model. The target can be retargeted
# at runtime from the dashboard; if the model has a `container:` block, the
# proxy will stop the old container and start the new one (useful for
# single-GPU setups where only one model fits at a time).
# aliases:
#   - name: current
#     target: qwen-2.5-7b

rate_limits:
  default:
    requests_per_minute: 60
    tokens_per_minute: 100000
